# Routing, time limits and alerts for the approval cycle.
# An administrator can change any value on the Rules page; every change is kept in the activity log.
# `cite` names a clause in the `cites` list at the end (Approval Process Handbook 2024-27 unless stated).

cycle:
  ay: "2027-28"
  # The date the system treats as today. In use this is left empty (the real date); the demo sets it
  # to a day in the middle of the approval cycle and lets you move it forward.
  today: "2027-05-17"
  # Application windows: pattern of the AICTE Public Notice for 2025-26 (04.11.2024), moved to the 2027-28 cycle.
  # `scrutiny_from`: committees for applications of that window are fixed from this date.
  windows:
    - {name: "Existing institutions, first group", regions: [Central, Eastern, Northern, North-Western, North-Eastern], from: "2026-11-06", to: "2026-11-20", scrutiny_from: "2027-01-04"}
    - {name: "Existing institutions, second group", regions: [Western, Southern, South-Western, South-Central], from: "2026-11-25", to: "2026-12-09", scrutiny_from: "2027-01-04"}
    - {name: "New institutions", new: true, from: "2026-12-14", to: "2026-12-25", scrutiny_from: "2027-02-15"}
  last_date_approval: "2027-06-10"
  last_date_after_appeal: "2027-06-30"
  ay_start: "2027-07-01"
  calendar_note: "AICTE Academic Calendar 2023-24 set 10 June for grant or refusal of approval and 30 June after appeal. The 2027-28 calendar is not yet notified; the administrator updates these dates when it is."
  # Executive Committee meetings that take decisions (set by the Council secretariat).
  ec_meetings: ["2027-01-28", "2027-02-25", "2027-03-18", "2027-04-08", "2027-04-29", "2027-05-13", "2027-05-27", "2027-06-08", "2027-06-24", "2027-06-29"]
  ec_prep_days: 3          # days the Regulation Bureau needs to place a case before the Executive Committee

# Stages. `days` is the time allowed for the whole stage (also the usual time it takes).
# For committee stages, `schedule_days` is the time allowed to fix the meeting, `lead` the notice
# the institution and experts must get, and `report` the time to record the outcome after the meeting.
# The handbook sets no internal time limits; these are the administrator's.
stages:
  self_disclosure: {label: "Self-disclosure check", short: "Self-disclosure", holder: RB, days: 7, cite: CL_2_5}
  scrutiny:    {label: "Scrutiny Committee", short: "Scrutiny", holder: committee, schedule_by: RB, days: 14, schedule_days: 21, lead: 7, report: 2, cite: CL_1_8_B}
  compliance:  {label: "Institution submits compliance", short: "Compliance", holder: institution, days: 15, cite: CL_2_4}
  re_scrutiny: {label: "Re-Scrutiny Committee", short: "Re-scrutiny", holder: committee, schedule_by: RB, days: 10, schedule_days: 10, lead: 5, report: 2, cite: CL_1_8_G}
  evc:         {label: "Expert Visit Committee", short: "EVC", holder: committee, schedule_by: RO, days: 21, schedule_days: 14, lead: 7, report: 2, video_before: 2, cite: CL_1_9_A}
  shc:         {label: "Standing Hearing Committee", short: "SHC", holder: committee, schedule_by: RB, days: 14, schedule_days: 10, lead: 7, report: 2, cite: CL_2_23_3}
  ec:          {label: "Executive Committee decision", short: "EC decision", holder: EC, days: 10, cite: CL_1_10_A}
  appeal:      {label: "Appeal window", short: "Appeal", holder: institution, days: 7, cite: CL_2_24_A}
  sac:         {label: "Standing Appellate Committee", short: "SAC", holder: committee, schedule_by: RB, days: 10, schedule_days: 5, lead: 5, report: 2, cite: CL_1_11_E}
  council:     {label: "Council decision", short: "Council", holder: EC, days: 5, cite: CL_1_11_E}

# Nature of application -> stages, exactly as APH Table 2.3 (and Chapter I for new institutions).
# `route` = stages marked "Yes"; `aa` = stages marked "AA" (as applicable, depending on the outcome of
# the previous steps). `deposit`: a security deposit is due after approval (Cl. 1.12, 2.25 d-e).
natures:
  eoa_self_disclosure:   {label: "Extension of Approval based on Self-Disclosure", route: [self_disclosure]}
  nri_seats:             {label: "Seats for Non-Resident Indians", route: [self_disclosure]}
  conversion_level:      {label: "Conversion of Diploma level into Degree level (and vice-versa)", route: [scrutiny, evc], aa: [shc, sac], deposit: true}
  name_change:           {label: "Change in name of Institution / affiliating University / type", route: [scrutiny]}
  new_programme:         {label: "New Programme / Level in an existing Institution", route: [scrutiny, evc], aa: [shc, sac], deposit: true}
  merger:                {label: "Merger of Institutions (same / different Trust, same campus or city)", route: [scrutiny, evc], aa: [shc, sac]}
  eoa_after_break:       {label: "Extension of Approval after a break / restoration / hibernation", route: [scrutiny, evc], aa: [shc, sac]}
  fn_oci_seats:          {label: "Supernumerary seats for Foreign Nationals / OCI / Gulf", route: [scrutiny]}
  increase_intake:       {label: "Increase in intake / additional course", route: [scrutiny, evc], aa: [shc, sac]}
  integrated_dual:       {label: "Integrated / Dual Degree course", route: [scrutiny, evc], aa: [shc, sac]}
  fpm:                   {label: "Fellow Programme in Management", route: [scrutiny, evc], aa: [shc, sac]}
  course_change:         {label: "Change in course name / merger of courses / reduction in intake", route: [scrutiny]}
  collaboration:         {label: "Collaboration and Twinning Programme", route: [scrutiny, evc], aa: [shc, sac]}
  change_of_site:        {label: "Change of site / location", route: [scrutiny, evc], aa: [shc, sac]}
  closure_institution:   {label: "Closure of the Institution", route: [scrutiny]}
  women_coed:            {label: "Women's Institution to Co-ed (and vice-versa)", route: [scrutiny], deposit: true}
  closure_programme:     {label: "Closure of Programme(s) / Course(s)", route: [scrutiny]}
  bank_details:          {label: "Change in the bank details", route: [scrutiny]}
  trust_name_change:     {label: "Change in name of the Trust / Society / Company", route: [scrutiny]}
  deemed_university:     {label: "Institution converted into a Deemed-to-be-University", route: [scrutiny, evc], aa: [shc, sac]}
  odl_online:            {label: "Online Learning / ODL courses", route: [scrutiny, evc], aa: [shc, sac]}
  new_institution:       {label: "New Technical Institution", route: [scrutiny, evc], aa: [sac], deposit: true, chapter: "I"}

countdown:
  # An application is "at risk" when one more round of deficiencies would push its decision past the
  # Academic Calendar date, and "needs fast-tracking" when even the usual pace would.
  fast_track_note: "Fast-tracking means holding each remaining committee at the minimum notice."

alerts:
  aicte:                         # steps held by an AICTE office, committee or the Executive Committee
    due_soon_days: 3
    ladder:
      - {level: 1, label: "Overdue", after: 1, to: "the holding office"}
      - {level: 2, label: "Escalated to head of office", after: 7, spare_below: 0, to: "head of the holding office"}
      - {level: 3, label: "Escalated to senior management", after: 14, spare_below: -7, to: "senior management"}
  institution:                   # steps held by the institution
    remind_before: [7, 3, 0]
    overdue_notice_after: [1, 7, 21]
    tell_officer_after: 3        # the processing officer is told, to decide the next step
  undertakings: {remind_before: [30, 7, 0], escalate_after: [1, 30]}
  documents:    {remind_before: [90, 60, 30, 7, 0], escalate_after: [1, 30]}
  lease:        {remind_before_months: [24, 12, 6, 3, 1]}
  verification: {days: 7}        # time an officer has to verify what an institution submitted
  channels:
    institution: [portal, email, sms]
    aicte: [portal, email]

documents:
  fire_noc:             {label: "Fire Safety Certificate", verify_by: RO, cite: CL_6_17_I}
  structural_stability: {label: "Structural Stability Certificate", verify_by: RO, valid_years: 5, building_age: 30, cite: CL_6_17_H}
  lease_deed:           {label: "Registered lease deed (land)", verify_by: RO, min_years: 30, cite: CL_2_1_E}
  occupancy:            {label: "Occupancy / Completion Certificate", verify_by: RO, cite: ANX1_OC}

deposit:
  days: 15
  steps:
    - {until: "05-31", penalty: 10}
    - {until: "07-31", penalty: 20}
  after: "Approval to be withdrawn: refer to the competent authority"
  cite: CL_2_25_F
  # Table 1.4, in lakh rupees: [Diploma, UG, PG]; doubled for private leased land or building.
  amounts: {Engineering: [15, 35, 15], Planning: [15, 15, 15], "Applied Arts and Crafts": [15, 15, 15], Design: [15, 15, 15],
            "Hotel Management and Catering Technology": [15, 15, 15], "Computer Applications": [0, 5, 15], Management: [0, 5, 15]}
  amounts_cite: T1_4

# Conditions an approval can be granted subject to. Each becomes a tracked item with a due date.
conditions:
  letter_deficiencies:    {label: "Comply with the deficiencies noted in the approval letter", due_months: 6, verify_by: RB, carry_forward: true, cite: EOA_LETTER,
                           consequence: "Noted again as a deficiency in next year's application (Cl. 2.25 c)"}
  remaining_requirements: {label: "Complete all remaining requirements of the Regulations and the APH", due_months: 1, verify_by: RB, cite: AFF_1MONTH,
                           consequence: "AICTE may withdraw approval (affidavit undertaking)"}
  occupancy_on_completion: {label: "Produce the Occupancy / Completion Certificate on completion of the building", due_months: 6, verify_by: RO, carry_forward: true, cite: ANX1_OC,
                           consequence: "Carried into next year's scrutiny as a deficiency"}
  faculty_before_start:   {label: "Appoint the Principal / Director and all faculty before the courses start", due_ay_start: true, verify_by: RB, cite: CL_1_6_D,
                           consequence: "The courses may not commence"}
  affiliation_within_loa: {label: "Obtain affiliation and State / UT requirements within the validity of the Letter of Approval", due_years: 2, verify_by: RB, cite: CL_1_10_LOA,
                           consequence: "The Letter of Approval stands cancelled on expiry"}

regions:
  Central: Bhopal
  Eastern: Kolkata
  Northern: Kanpur
  North-Western: Chandigarh
  North-Eastern: Guwahati
  South-Central: Hyderabad
  Southern: Chennai
  South-Western: Bengaluru
  Western: Mumbai

